name: LivingWorld population execution

on:
  pull_request:
    branches:
      - Playerbot

permissions:
  contents: read

concurrency:
  group: livingworld-population-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  population-execution-tests:
    name: Bounded population execution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test population execution
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldPopulationExecution.cpp \
            modules/mod-livingworld/src/LivingWorldPopulationCandidates.cpp \
            modules/mod-livingworld/tests/LivingWorldPopulationExecutionTests.cpp \
            -o /tmp/livingworld-population-execution-tests
          /tmp/livingworld-population-execution-tests
