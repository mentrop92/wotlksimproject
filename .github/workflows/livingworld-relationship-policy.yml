name: LivingWorld relationship policy

on:
  pull_request:
    branches:
      - Playerbot

permissions:
  contents: read

concurrency:
  group: livingworld-relationship-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relationship-policy-tests:
    name: Bounded relationship policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test relationship policy
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldRelationshipPolicy.cpp \
            modules/mod-livingworld/tests/LivingWorldRelationshipPolicyTests.cpp \
            -o /tmp/livingworld-relationship-policy-tests
          /tmp/livingworld-relationship-policy-tests
