name: nopch-module-build
on:
  push:
    branches:
      - 'master'
      - 'test-staging'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'src/*'
      - 'src/common/**/*'
      - 'src/genrev/**/*'
      - 'src/server/*'
      - 'src/server/apps/**/*'
      - 'src/server/database/**/*'
      - 'src/server/game/**/*'
      - 'src/server/shared/**/*'
      - 'src/tools/**/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modules:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            compiler:
              CC: clang-18
              CXX: clang++-18
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.compiler.CC }}-nopch-modules
    if: github.repository == 'mod-playerbots/azerothcore-wotlk' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout modules
        run: bash -x ./apps/ci/ci-install-modules.sh
      - uses: ./.github/actions/linux-build
        with:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
          modules: true
          pch: false
          maxerrors: 0
          keepgoing: true
