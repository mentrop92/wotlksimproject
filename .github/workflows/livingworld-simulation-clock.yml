name: LivingWorld simulation clock

on:
  workflow_dispatch:
  push:
    branches:
      - agent/livingworld-accelerated-simulation
  pull_request:
    branches:
      - Playerbot

permissions:
  contents: read

concurrency:
  group: livingworld-clock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clock-tests:
    name: Bounded accelerated simulation clock
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test accelerated simulation clock
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldSimulationClock.cpp \
            modules/mod-livingworld/tests/LivingWorldSimulationClockTests.cpp \
            -o /tmp/livingworld-simulation-clock-tests
          /tmp/livingworld-simulation-clock-tests
