name: LivingWorld simulation run plan

on:
  workflow_dispatch:
  push:
    branches:
      - agent/livingworld-simulation-run-plan
  pull_request:
    branches:
      - Playerbot

permissions:
  contents: read

concurrency:
  group: livingworld-run-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-plan-tests:
    name: Bounded simulation run planning
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test simulation run planning
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldSimulationRunPlan.cpp \
            modules/mod-livingworld/tests/LivingWorldSimulationRunPlanTests.cpp \
            -o /tmp/livingworld-simulation-run-plan-tests
          /tmp/livingworld-simulation-run-plan-tests
