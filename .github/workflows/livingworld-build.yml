name: LivingWorld combined build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/livingworld-phase-0-1
      - agent/livingworld-profile-persistence
  pull_request:
    branches:
      - Playerbot

permissions:
  contents: read

concurrency:
  group: livingworld-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 24.04 / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Playerbot core fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout Playerbots module fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mentrop92/mod-playerbots
          ref: master
          path: modules/mod-playerbots
          persist-credentials: false

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            libboost-all-dev \
            libbz2-dev \
            libmysqlclient-dev \
            libncurses-dev \
            libreadline-dev \
            libssl-dev \
            make \
            mysql-server

      - name: Test deterministic LivingWorld profiles
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldProfile.cpp \
            modules/mod-livingworld/tests/LivingWorldProfileTests.cpp \
            -o /tmp/livingworld-profile-tests
          /tmp/livingworld-profile-tests

      - name: Test LivingWorld population controller
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldPopulationController.cpp \
            modules/mod-livingworld/tests/LivingWorldPopulationControllerTests.cpp \
            -o /tmp/livingworld-population-tests
          /tmp/livingworld-population-tests

      - name: Test LivingWorld schedule planner
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -I modules/mod-livingworld/src \
            modules/mod-livingworld/src/LivingWorldSchedulePlanner.cpp \
            modules/mod-livingworld/tests/LivingWorldSchedulePlannerTests.cpp \
            -o /tmp/livingworld-schedule-tests
          /tmp/livingworld-schedule-tests

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: livingworld-ubuntu-24.04
          max-size: 2G

      - name: Configure AzerothCore
        run: |
          cmake \
            -S "${GITHUB_WORKSPACE}" \
            -B "${GITHUB_WORKSPACE}/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build AzerothCore with Playerbots and LivingWorld
        id: livingworld-build
        shell: bash
        run: |
          set +e
          cmake --build "${GITHUB_WORKSPACE}/build" --config Release --parallel 2 > /tmp/livingworld-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "LivingWorld combined build failed. Compiler diagnostics:"
              grep -nE "(^|[[:space:]])(fatal error:|error:|undefined reference|collect2: error)" /tmp/livingworld-build.log | tail -n 200 || true
              echo
              echo "Last 250 build-log lines:"
              tail -n 250 /tmp/livingworld-build.log
            } > /tmp/livingworld-diagnostics.txt
            cat /tmp/livingworld-diagnostics.txt
            exit "$status"
          fi
          tail -n 40 /tmp/livingworld-build.log

      - name: Upload compiler diagnostics
        if: failure() && steps.livingworld-build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: livingworld-compiler-diagnostics
          path: |
            /tmp/livingworld-diagnostics.txt
            /tmp/livingworld-build.log
          retention-days: 3
          if-no-files-found: error

      - name: Confirm LivingWorld module was configured
        run: |
          test -f modules/mod-livingworld/src/LW_loader.cpp
          test -f modules/mod-livingworld/data/sql/db-characters/livingworld_base.sql
          test -f modules/mod-livingworld/data/sql/db-auth/base/livingworld_rbac.sql
          grep -R "Addmod_livingworldScripts" build modules -n
