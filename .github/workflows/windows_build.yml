name: windows-build

on:
  push:
    branches: [ "Playerbot", "test-staging" ]
  pull_request:
    branches: [ "Playerbot", "test-staging" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        # AzerothCore's current dependency bootstrap installs the VS2022 native
        # desktop workload. Pin the runner generation so the required VS2022
        # product is present instead of following windows-latest to VS2026.
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - name: Checkout AzerothCore
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout Playerbot Module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ github.ref_name == 'Playerbot' && 'master' || 'test-staging' }}
          path: modules/mod-playerbots
          persist-credentials: false

      - name: Move repo to short path
        shell: bash
        run: |
          mkdir C:/ac
          cp -r . C:/ac/

      - name: ccache
        uses: hendrikmuhs/ccache-action@c92f40bee50034e84c763e33b317c77adaa81c92 # v1.2.13

      - name: Configure OS
        shell: bash
        env:
          CONTINUOUS_INTEGRATION: true
        run: |
          cd C:/ac
          ./acore.sh install-deps

      - name: Build
        shell: bash
        run: |
          cd C:/ac
          export CTOOLS_BUILD=all
          ./acore.sh compiler build
